<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Thiệp Sinh Nhật</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Be+Vietnam+Pro:wght@400;500&display=swap">
<style>
  /* Layout: one candlelit card, centred on a night sky; cake on top, letter below, one action at the bottom. */
  :root {
    --night: #1c1730;
    --night-2: #2a2242;
    --paper: #fbf3ea;
    --ink: #3a2e3f;
    --ink-soft: #7a6874;
    --flame: #f5b75e;
    --blush: #ee9fb0;
    --font-hand: "Dancing Script", "Brush Script MT", cursive;
    --font-body: "Lora", Georgia, "Times New Roman", serif;
    --font-ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { min-height: 100%; }
  body {
    background:
      radial-gradient(120% 70% at 50% 0%, var(--night-2) 0%, var(--night) 60%),
      var(--night);
    color: var(--paper);
    font-family: var(--font-body);
    padding-block: 32px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }
  #sky {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 440px;
    display: flex; flex-direction: column; align-items: center;
    gap: 20px;
  }
  .cake { width: 168px; max-width: 60%; height: auto; overflow: visible; }
  .flame { transform-origin: 80px 46px; animation: flicker 1.6s ease-in-out infinite; transition: opacity .5s, transform .5s; }
  .glow { animation: breathe 2.4s ease-in-out infinite; transition: opacity .6s; }
  .smoke { opacity: 0; }
  .out .flame { opacity: 0; transform: scale(.2) translateY(6px); animation: none; }
  .out .glow { opacity: 0; animation: none; }
  .out .smoke { animation: smoke 2.2s ease-out .2s forwards; }
  @keyframes flicker {
    0%,100% { transform: scale(1, 1) rotate(-1deg); }
    35% { transform: scale(.94, 1.08) rotate(2deg); }
    70% { transform: scale(1.04, .95) rotate(-2deg); }
  }
  @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: .85; } }
  @keyframes smoke {
    0% { opacity: .7; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-36px); }
  }

  h1 {
    margin: 0;
    font-family: var(--font-hand);
    font-weight: 700;
    font-size: clamp(2.4rem, 9vw, 3.1rem);
    line-height: 1.1;
    color: var(--flame);
    text-align: center;
    text-wrap: balance;
    text-shadow: 0 0 24px rgba(245, 183, 94, .35);
  }

  .letter {
    width: 100%;
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px 4px 18px 4px;
    padding: 28px 26px 24px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
    display: flex; flex-direction: column; gap: 14px;
  }
  .letter p {
    margin: 0;
    font-size: 1.08rem;
    line-height: 1.75;
    animation: rise .9s ease-out both;
  }
  .letter p:nth-child(1) { animation-delay: .3s; }
  .letter p:nth-child(2) { animation-delay: 1.1s; }
  .letter p:nth-child(3) { animation-delay: 1.9s; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .from {
    margin-top: 6px;
    font-family: var(--font-ui);
    font-size: .78rem;
    letter-spacing: .04em;
    color: var(--ink-soft);
    text-align: right;
  }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  button {
    font-family: var(--font-ui);
    font-size: .95rem;
    font-weight: 500;
    border-radius: 999px;
    padding: 12px 22px;
    cursor: pointer;
    border: 1px solid rgba(245, 183, 94, .55);
    background: rgba(245, 183, 94, .12);
    color: var(--flame);
    transition: background .2s, transform .1s;
  }
  button:hover { background: rgba(245, 183, 94, .22); }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 2px solid var(--blush); outline-offset: 3px; }
  button.primary { background: var(--flame); color: var(--night); border-color: var(--flame); }
  button.primary:hover { background: #f8c67c; }
  .hint {
    margin: 0;
    font-family: var(--font-ui);
    font-size: .8rem;
    color: rgba(251, 243, 234, .6);
    text-align: center;
    min-height: 1.2em;
  }

  /* full-screen heart shown after the candle is blown out */
  .big {
    position: fixed; inset: 0; z-index: 20;
    background: radial-gradient(90% 60% at 50% 40%, #241a38 0%, #0e0a1a 70%), #0e0a1a;
    opacity: 0;
    transition: opacity .6s;
  }
  .big.show { opacity: 1; }
  #bigc { position: absolute; inset: 0; width: 100%; height: 100%; }
  .big-text {
    position: absolute; left: 0; right: 0;
    bottom: calc(7vh + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    opacity: 0; transform: translateY(12px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  .big.done .big-text { opacity: 1; transform: none; }
  .big-title {
    margin: 0;
    font-family: var(--font-hand);
    font-weight: 700;
    font-size: clamp(2.3rem, 10vw, 3.6rem);
    color: var(--flame);
    text-align: center;
    text-shadow: 0 0 28px rgba(245, 183, 94, .45);
  }

  @media (prefers-reduced-motion: reduce) {
    .flame, .glow, .letter p { animation: none; }
  }
</style>

<canvas id="sky" aria-hidden="true"></canvas>

<main class="card">
  <h1>Chúc mừng sinh nhật</h1>

  <article class="letter">
    <p>Chúc bạn một sinh nhật thật đủ đầy, như chính ánh mắt và nụ cười của bạn.</p>
    <p>Tôi không giỏi nói những lời hoa mỹ, nhưng thật lòng mong bạn luôn hạnh phúc, không chỉ hôm nay mà cả mai sau này.</p>
  </article>

  <svg id="cake" class="cake" viewBox="0 0 160 150" role="img" aria-label="Bánh sinh nhật với một ngọn nến">
    <defs>
      <radialGradient id="g" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f5b75e" stop-opacity=".7"/>
        <stop offset="100%" stop-color="#f5b75e" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle class="glow" cx="80" cy="34" r="40" fill="url(#g)"/>
    <path class="smoke" d="M80 44 q-5 -8 0 -16 q5 -8 0 -16" stroke="#c9bfd6" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path class="flame" d="M80 22 C86 32 88 38 80 46 C72 38 74 32 80 22 Z" fill="#f5b75e"/>
    <rect x="76" y="46" width="8" height="26" rx="2" fill="#ee9fb0"/>
    <rect x="76" y="52" width="8" height="3" fill="#fbf3ea"/>
    <rect x="76" y="61" width="8" height="3" fill="#fbf3ea"/>
    <rect x="34" y="72" width="92" height="30" rx="6" fill="#fbf3ea"/>
    <path d="M34 82 q11.5 10 23 0 t23 0 t23 0 t23 0" fill="#ee9fb0"/>
    <rect x="22" y="100" width="116" height="34" rx="6" fill="#f3d9c9"/>
    <path d="M22 110 q14.5 10 29 0 t29 0 t29 0 t29 0" fill="#ee9fb0" opacity=".8"/>
    <rect x="12" y="132" width="136" height="7" rx="3.5" fill="#c9bfd6"/>
  </svg>

  <div class="actions">
    <button id="blow" class="primary" type="button">Thổi nến 🕯️</button>
    <button id="music" type="button">Nghe nhạc ♪</button>
  </div>
  <p id="hint" class="hint">Ước một điều trước khi thổi nến nhé</p>
</main>

<div id="big" class="big" hidden>
  <canvas id="bigc" aria-hidden="true"></canvas>
  <div class="big-text">
    <p class="big-title">Chúc mừng sinh nhật</p>
    <button id="close" type="button">Xem lại thiệp</button>
  </div>
</div>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- falling petals & sparkles ----
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  const resize = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize();
  addEventListener('resize', resize);

  const colors = ['#ee9fb0', '#f5b75e', '#fbf3ea', '#f7c4cf'];
  const stars = Array.from({ length: 40 }, () => ({
    x: Math.random(), y: Math.random() * 0.6, r: Math.random() * 1.2 + .3, p: Math.random() * 6.28
  }));
  let petals = [];
  const spawn = (n, burst) => {
    for (let i = 0; i < n; i++) {
      petals.push({
        x: burst ? W / 2 + (Math.random() - .5) * 120 : Math.random() * W,
        y: burst ? H * .25 : -20 - Math.random() * H * .5,
        vx: burst ? (Math.random() - .5) * 6 : (Math.random() - .5) * .6,
        vy: burst ? -Math.random() * 6 - 2 : Math.random() * .8 + .6,
        s: Math.random() * 6 + 5,
        a: Math.random() * 6.28,
        va: (Math.random() - .5) * .08,
        c: colors[(Math.random() * colors.length) | 0],
        life: 0
      });
    }
  };
  if (!reduce) spawn(14, false);

  const drawPetal = p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.a);
    ctx.fillStyle = p.c;
    ctx.globalAlpha = .85;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.s, p.s * .55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  };

  let t = 0;
  const tick = () => {
    t += 1;
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      ctx.globalAlpha = .35 + .35 * Math.sin(t * .02 + s.p);
      ctx.fillStyle = '#fbf3ea';
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const p of petals) {
      p.vy = Math.min(p.vy + .06, 1.8);
      p.vx *= .985;
      p.x += p.vx + Math.sin((t + p.s * 10) * .02) * .4;
      p.y += p.vy;
      p.a += p.va;
      drawPetal(p);
    }
    petals = petals.filter(p => p.y < H + 30);
    if (!reduce && petals.length < 14 && Math.random() < .03) spawn(1, false);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);

  // ---- beating particle heart (x = 16sin³t, y = 13cos t − 5cos 2t − 2cos 3t − cos 4t) ----
  const heartXY = t => [
    16 * Math.sin(t) ** 3,
    -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
  ];
  // points in heart units: the outline, particles bleeding inward from it, then a soft fill toward the centre
  function buildPoints(edgeN, fillN, size) {
    const out = [], edge = [];
    for (let i = 0; i < edgeN; i++) {
      const [x, y] = heartXY(Math.random() * Math.PI * 2);
      edge.push([x, y]);
      out.push({ x, y, s: (Math.random() * 1.2 + 1) * size, a: .95 });
    }
    for (const [x, y] of edge) {
      for (let j = 0; j < 2; j++) {
        const k = 1 - (-0.06 * Math.log(Math.random()));
        out.push({ x: x * k, y: y * k, s: (Math.random() + .8) * size, a: .8 });
      }
    }
    for (let i = 0; i < fillN; i++) {
      const [x, y] = edge[(Math.random() * edge.length) | 0];
      const k = Math.max(1 - (-0.2 * Math.log(Math.random())), 0);
      out.push({ x: x * k, y: y * k, s: (Math.random() * .9 + .6) * size, a: .55 });
    }
    return out;
  }
  const beatAt = ms => {
    const p = (ms % 1100) / 1100;          // one beat every 1.1 s
    const lub = Math.exp(-((p - .18) ** 2) / .004);
    const dub = Math.exp(-((p - .38) ** 2) / .006) * .6;
    return lub + dub;
  };
  // ---- the big heart: particles burst out of the candle, fly in and lock into a heart, then fireworks ----
  const big = document.getElementById('big');
  const bc = document.getElementById('bigc');
  const bx = bc.getContext('2d');
  const ASSEMBLE = 2.3;                    // seconds until every particle has landed
  const fwColors = ['#ff4f86', '#f5b75e', '#ff9bbd', '#fbf3ea', '#c79bff'];
  let BW = 0, BH = 0, bigPts = [], sparks = [], bigOn = false, bigStart = 0, landed = false, nextFw = 0;
  let origin = [0, 0];
  const sizeBig = () => {
    const r = Math.min(window.devicePixelRatio || 1, 2);
    BW = bc.clientWidth; BH = bc.clientHeight;
    bc.width = BW * r; bc.height = BH * r;
    bx.setTransform(r, 0, 0, r, 0, 0);
  };
  addEventListener('resize', () => { if (bigOn) sizeBig(); });
  const ease = u => u < .5 ? 4 * u * u * u : 1 - (-2 * u + 2) ** 3 / 2;
  const burst = (x, y, n, speed, color) => {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = speed * (.4 + Math.random() * .6);
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1,
        c: color || fwColors[(Math.random() * fwColors.length) | 0] });
    }
  };

  const openBig = () => {
    big.hidden = false;
    sizeBig();
    const rc = cake.getBoundingClientRect();
    origin = [rc.left + rc.width / 2, rc.top + rc.height * .25];
    const spread = Math.max(BW, BH) * .55;
    bigPts = buildPoints(1100, 2600, 1.25).map(p => {
      const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * spread;
      return Object.assign(p, { mx: Math.cos(a) * d, my: Math.sin(a) * d - spread * .3, d: Math.random() * .7 });
    });
    sparks = []; landed = reduce; nextFw = 0;
    big.classList.toggle('done', reduce);
    requestAnimationFrame(() => big.classList.add('show'));
    bigStart = performance.now();
    if (!bigOn) { bigOn = true; requestAnimationFrame(drawBig); }
  };
  const closeBig = () => {
    bigOn = false;
    big.classList.remove('show');
    setTimeout(() => { big.hidden = true; }, 600);
  };
  document.getElementById('close').addEventListener('click', closeBig);

  const drawBig = now => {
    if (!bigOn) return;
    const e = reduce ? ASSEMBLE + 1 : (now - bigStart) / 1000;
    const S = Math.min(BW * .9 / 34, BH * .58 / 30);
    const hx0 = BW / 2, hy0 = BH * .42 - 2.5 * S;   // heart centre sits at 42% of the screen height
    const b = e > ASSEMBLE && !reduce ? beatAt(now) : 0;

    if (!landed && e >= ASSEMBLE) {
      landed = true;
      burst(hx0, hy0 + 2.5 * S, 320, 11, '#f5b75e');
      burst(hx0, hy0 + 2.5 * S, 200, 7, '#ff9bbd');
      big.classList.add('done');
      nextFw = now + 500;
    }
    if (landed && !reduce && now > nextFw) {
      burst(BW * (.1 + Math.random() * .8), BH * (.06 + Math.random() * .22), 90, 5);
      nextFw = now + 700 + Math.random() * 900;
    }

    bx.clearRect(0, 0, BW, BH);
    bx.globalCompositeOperation = 'lighter';
    bx.fillStyle = '#ff4f86';
    for (const p of bigPts) {
      const k = 1 + .09 * b * (.4 + Math.hypot(p.x, p.y) / 17);
      const tx = hx0 + p.x * S * k, ty = hy0 + p.y * S * k;
      const u = Math.min(Math.max((e - p.d) / (ASSEMBLE - .7), 0), 1);
      let x = tx, y = ty;
      if (u < 1) {
        // quadratic curve: candle -> a random point flung outward -> its place in the heart
        const q = ease(u), w = 1 - q;
        const mx = origin[0] + p.mx, my = origin[1] + p.my;
        x = w * w * origin[0] + 2 * w * q * mx + q * q * tx;
        y = w * w * origin[1] + 2 * w * q * my + q * q * ty;
      }
      const j = reduce ? 0 : (Math.random() - .5) * (.6 + b * 1.6);
      bx.globalAlpha = u < 1 ? p.a * (.5 + .5 * u) : p.a;
      bx.fillRect(x + j, y + j, p.s, p.s);
    }
    if (landed) {
      const halo = reduce ? 0 : (500 + 900 * b) | 0;
      bx.fillStyle = '#ff9bbd';
      for (let i = 0; i < halo; i++) {
        const [x, y] = heartXY(Math.random() * Math.PI * 2);
        const k = 1.1 + .1 * b + Math.random() * .12;
        bx.globalAlpha = .25 + Math.random() * .45;
        bx.fillRect(hx0 + x * S * k + (Math.random() - .5) * S * 1.6,
                    hy0 + y * S * k + (Math.random() - .5) * S * 1.6, 1.6, 1.6);
      }
    }
    for (const s of sparks) {
      s.x += s.vx; s.y += s.vy;
      s.vx *= .965; s.vy = s.vy * .965 + .05;
      s.life -= .011;
      bx.globalAlpha = Math.max(s.life, 0);
      bx.fillStyle = s.c;
      bx.fillRect(s.x, s.y, 2.2, 2.2);
    }
    sparks = sparks.filter(s => s.life > 0);
    bx.globalAlpha = 1;
    bx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(drawBig);
  };

  // ---- music box "Happy Birthday" (public domain melody) ----
  let ac = null, playing = false;
  const N = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
  const song = [
    ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
    ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
    ['G4', .75], ['G4', .25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2],
    ['F5', .75], ['F5', .25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 3]
  ];
  const musicBtn = document.getElementById('music');
  const play = () => {
    if (playing) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      ac.resume();
    } catch (e) { return; }
    playing = true;
    musicBtn.textContent = 'Đang phát ♪';
    const beat = .42;
    let at = ac.currentTime + .1;
    for (const [n, d] of song) {
      [1, 2].forEach((mult, i) => {
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = i ? 'sine' : 'triangle';
        o.frequency.value = N[n] * mult;
        g.gain.setValueAtTime(0, at);
        g.gain.linearRampToValueAtTime(i ? .05 : .22, at + .01);
        g.gain.exponentialRampToValueAtTime(.001, at + Math.max(d * beat, .3) + .6);
        o.connect(g).connect(ac.destination);
        o.start(at);
        o.stop(at + d * beat + .7);
      });
      at += d * beat;
    }
    setTimeout(() => { playing = false; musicBtn.textContent = 'Nghe lại ♪'; }, (at - ac.currentTime) * 1000 + 600);
  };
  musicBtn.addEventListener('click', play);

  // ---- blow out / relight ----
  const cake = document.getElementById('cake');
  const blow = document.getElementById('blow');
  const hint = document.getElementById('hint');
  blow.addEventListener('click', () => {
    const out = cake.classList.toggle('out');
    if (out) {
      blow.textContent = 'Thắp lại nến';
      hint.textContent = 'Điều ước đã được gửi đi rồi ✨';
      spawn(reduce ? 0 : 70, true);
      play();
      setTimeout(openBig, 700);
    } else {
      blow.textContent = 'Thổi nến 🕯️';
      hint.textContent = 'Ước một điều trước khi thổi nến nhé';
    }
  });
})();
</script>

</body>
</html>
